name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Desplegar en VPS
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar deploy en la VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            REPO="${{ secrets.VPS_REPO_PATH }}"
            if [[ -z "$REPO" ]]; then
              REPO="/var/www/avergas"
            fi

            if [[ ! -f "$REPO/scripts/deploy.sh" ]]; then
              echo "▶ Bootstrap: clonando repo en $REPO"
              BACKUP="${REPO}.bak.$(date +%Y%m%d%H%M%S)"
              if [[ -e "$REPO" ]]; then
                mv "$REPO" "$BACKUP"
                echo "  Backup en $BACKUP"
              fi
              git clone https://github.com/LucasAlderete/lk-avergas.git "$REPO"
              chmod +x "$REPO/scripts/deploy.sh"
            fi

            cd "$REPO"
            ./scripts/deploy.sh
